<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>total_company — 月次</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="main-page">
  <div class="sticky-top">
    <header>
      <h1>total_company</h1>
      <p class="subtitle">月次 BS / PL — 科目クリックでグラフ（別ウィンドウ）</p>
    </header>

    <section class="controls">
      <label>
        表示
        <select id="companySelect"></select>
      </label>
      <label>
        表示範囲
        <select id="rangeSelect">
          <option value="all">全期間</option>
          <option value="12">直近12ヶ月</option>
          <option value="24">直近24ヶ月</option>
        </select>
      </label>
      <label>
        科目検索
        <input id="searchInput" type="search" placeholder="例: 人件費, 税引前">
      </label>
    </section>

    <section class="tab-bar">
      <div class="tabs">
        <button class="tab active" data-tab="bs">BS（貸借）</button>
        <button class="tab" data-tab="pl">PL（損益）</button>
      </div>
    </section>
  </div>

  <section class="meta" id="metaInfo"></section>
  <section class="table-wrap" id="tableContainer"></section>

  <script src="app.js?v=4"></script>
</body>
</html>
