# 全会社共通の統一科目マッピング
#
# 使い方:
#   - aliases: 完全一致で canonical に変換
#   - pattern: 正規表現でマッチした名称を canonical に変換（merge: true で合算）
#   - ルールに無い科目はそのまま表示（scan-unmapped で未登録を確認）
#
# 他社データ追加後、名称差分があれば aliases に追記してください。

rules:
  # --- 損益計算書 ---
  - id: pl_outsourcing
    canonical: 外注費（売上原価）
    statement: [pl]
    aliases:
      - 外注費
      - 外注費（売上原価）

  - id: pl_rent
    canonical: 地代家賃
    statement: [pl]
    aliases:
      - 地代家賃
      - 賃借料
      - 家賃

  - id: pl_entertainment
    canonical: 交際費
    statement: [pl]
    aliases:
      - 交際費
      - 接待交際費

  - id: pl_inventory_open
    canonical: 期首商品棚卸
    statement: [pl]
    aliases:
      - 期首商品棚卸
      - 期首商品棚卸高

  - id: pl_inventory_close
    canonical: 期末商品棚卸
    statement: [pl]
    aliases:
      - 期末商品棚卸
      - 期末商品棚卸高

  - id: pl_corp_tax
    canonical: 法人税等
    statement: [pl]
    aliases:
      - 法人税等
      - 法人税・住民税及び事業税

  # --- 貸借対照表: 口座・暗号資産をグループ化 ---
  - id: bs_bank_api
    canonical: 銀行預金（API連携）
    statement: [bs]
    pattern: ".+（法人）（API）"
    merge: true

  - id: bs_bank_manual
    canonical: 銀行預金
    statement: [bs]
    pattern: "^(岩手医信|北上信金|岩手銀行|GMOあおぞら|楽天（法人）|住信SBI|七十七銀行|山形銀行)"
    merge: true

  - id: bs_deposit_parent
    canonical: 銀行預金
    statement: [bs]
    aliases:
      - 普通預金
    merge: false

  - id: bs_prepaid_tax
    canonical: 仮払税金
    statement: [bs]
    aliases:
      - 仮払税金
      - 仮払法人税
      - 仮払消費税

  - id: bs_cash
    canonical: 現金及び預金
    statement: [bs]
    aliases:
      - 現金
      - 小口現金
      - 厨房_小口現金
      - 小口現金_旧
    merge: true

  - id: bs_crypto
    canonical: 暗号資産・FX口座
    statement: [bs]
    aliases:
      - bybit
      - Bybit
      - coincheck
      - CoinCheck
      - SBI_FX
      - bit flyer
      - zaif
      - QUOINEX
    merge: true

  - id: bs_credit_card
    canonical: クレジットカード未払
    statement: [bs]
    aliases:
      - JCBカード
      - 三井住友VISAカード
      - 三井住友VISAカード1
    pattern: "^(UPSIDER|アメリカン・エキスプレス)"
    merge: true

